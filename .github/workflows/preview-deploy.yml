# Push to any non-main branch → builds a preview at /unfortunately/preview/<branch-name>/
name: Preview Deploy
on:
  push:
    branches-ignore: [main]
permissions:
  contents: write
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Sanitize branch name
        id: branch
        run: echo "name=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT
      - name: Build with preview base path
        run: npx vite build --base=/unfortunately/preview/${{ steps.branch.outputs.name }}/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/${{ steps.branch.outputs.name }}
          keep_files: true
      - name: Comment preview URL
        run: |
          gh pr comment --body "Preview: https://rsasbeih.github.io/unfortunately/preview/${{ steps.branch.outputs.name }}/" || true
        env:
          GH_TOKEN: ${{ github.token }}
